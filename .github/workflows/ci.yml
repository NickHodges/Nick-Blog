name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check for build and type issues
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run check
        run: npm run check

      - name: Run build
        run: npm run build:ci
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-test-password
          REDIS_URL: redis://localhost:6379
          RESPECTIFY_EMAIL: ci@example.com
          RESPECTIFY_API_KEY: ci-test-key
          ASTRO_DATABASE_FILE: ./.astro/content.db
